name: Deploy production

# Production releases only: v1.0.0, v1.4.2 …
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# A pre-release tag such as v1.0.0-test.1 does NOT match — the pattern has no
# trailing wildcard, so the leftover "-test.1" stops it. There is no test
# workflow in this repository; add one modelled on this file if a staging
# stack is ever wanted, giving it its own DOMAIN, PROXY_PORT, STACK_NAME and
# DEPLOY_PATH so the two cannot touch each other.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}-app
  NGINX_IMAGE: ghcr.io/${{ github.repository }}-nginx

  DOMAIN: pos-inventory-api.hayzeeonline.com
  PROXY_PORT: "8095"

  # Keeps this stack's containers, volumes and network distinct from anything
  # else on the host.
  STACK_NAME: hayzee_pos_api
  DEPLOY_PATH: /srv/hayzee-pos-api

  # The queue worker and scheduler are behind a compose profile and off by
  # default: nothing in the app queues a job or schedules a command yet. Set
  # this to 1 — and QUEUE_CONNECTION=redis in the ENV_PRODUCTION secret — when
  # that changes.
  WITH_WORKERS: "0"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same 8.2 line the images run. A release that cannot pass its own
      # tests should not reach the registry.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, gd, intl, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml supplies APP_KEY, JWT_SECRET and everything else the suite
      # needs, so the values in here are never used. The *file* still has to
      # exist: .env is gitignored, so on a fresh checkout phpdotenv calls
      # @file_get_contents('.env') on a missing path, and PHPUnit's error
      # handler — which is installed before Laravel replaces it with its own —
      # reports that suppressed warning against every test.
      #
      # Laravel builds its env repository with ->immutable(), so the empty
      # APP_KEY= and JWT_SECRET= in .env.example cannot override the test keys
      # phpunit.xml has already set.
      - name: Create .env
        run: cp .env.example .env

      # phpunit.xml points the suite at an in-memory SQLite database, so no
      # service container is needed.
      - name: Run tests
        run: php artisan test

  deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Both halves are built in — no secret to create or rotate.
      # github.actor is whoever triggered the run; GITHUB_TOKEN is minted for
      # this job, scoped to this repository, and expires when the job ends.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the release (v1.0.0) as well as the commit, so what is
      # running on the server is traceable to a version, not just a hash.
      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: runtime
          push: true
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          # Lifts Composer's api.github.com quota from 60/hour-per-IP (shared
          # with every other runner) to the token's own allowance. A secret,
          # not a build-arg, so it is not recorded in the image history.
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.ref_name }}
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built FROM the app image so both always carry the same public/ assets.
      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          build-args: |
            APP_IMAGE=${{ env.APP_IMAGE }}:${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ github.ref_name }}
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
            ${{ env.NGINX_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Written on the runner (ephemeral, isolated) and copied over, rather
      # than kept by hand on the server. GitHub is the single source of truth
      # for production configuration.
      - name: Create .env from secret
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          # Deliberately NOT chmod 600 here. scp-action tars the workspace
          # from inside a container running as a different user, so an
          # owner-only file gives "tar: can't open '.env': Permission denied".
          # The runner is ephemeral and single-tenant; deploy.sh chmods it 600
          # on arrival, which is where it actually matters.
          #
          # Fail loudly now rather than with a confusing error on the server.
          grep -q '^APP_KEY=base64:' .env || { echo "secret has no APP_KEY";    exit 1; }
          grep -q '^DB_HOST='        .env || { echo "secret has no DB_HOST";    exit 1; }
          # Every token is signed with this; without it the app boots and then
          # fails on the first login.
          grep -q '^JWT_SECRET=.\+'  .env || { echo "secret has no JWT_SECRET"; exit 1; }
          # Laravel 11 renamed these. The old spellings are read by nothing
          # and fail silently, so catch a secret copied from the old .env.
          if grep -qE '^(CACHE_DRIVER|MAIL_DRIVER|BROADCAST_DRIVER)=' .env; then
            echo "secret uses pre-Laravel-11 key names (CACHE_DRIVER/MAIL_DRIVER/BROADCAST_DRIVER)."
            echo "Rename them to CACHE_STORE/MAIL_MAILER/BROADCAST_CONNECTION — see .env.example."
            exit 1
          fi
          # Dates are stored as naive Africa/Lagos time; a different zone here
          # silently reinterprets every timestamp in the database.
          grep -q '^APP_TIMEZONE=.*Lagos' .env || { echo "secret does not set APP_TIMEZONE=Africa/Lagos"; exit 1; }
          echo "wrote .env ($(wc -l < .env) lines)"
        env:
          ENV_FILE: ${{ secrets.ENV_PRODUCTION }}

      - name: Copy deploy files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ".env,docker-compose.prod.yml,docker/deploy.sh,docker/provision-apache.sh,docker/apache-vhost.conf.example"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: REGISTRY,REGISTRY_USER,REGISTRY_TOKEN,APP_IMG,NGINX_IMG,DEPLOY_DIR,STACK_NAME,APP_PORT,DOMAIN,SUDO_PASS,WITH_WORKERS
          script_stop: true
          script: |
            set -Eeuo pipefail
            echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            cd "$DEPLOY_DIR"
            chmod +x docker/deploy.sh docker/provision-apache.sh
            ./docker/deploy.sh "$APP_IMG" "$NGINX_IMG"
            docker logout "$REGISTRY"

            # Apache runs in this same session rather than a step of its own:
            # the check costs milliseconds, but a second ssh-action means
            # another container start and another password handshake, which is
            # where the time actually went. Once the vhost is in place the
            # script exits immediately.
            echo "$SUDO_PASS" | sudo -S -p '' \
              ./docker/provision-apache.sh "$DOMAIN" "$APP_PORT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMG: ${{ env.APP_IMAGE }}:${{ github.sha }}
          NGINX_IMG: ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          DEPLOY_DIR: ${{ env.DEPLOY_PATH }}
          STACK_NAME: ${{ env.STACK_NAME }}
          WITH_WORKERS: ${{ env.WITH_WORKERS }}
          # One value drives all three: the container's published port, the
          # health check, and the port Apache proxies to.
          APP_PORT: ${{ env.PROXY_PORT }}
          DOMAIN: ${{ env.DOMAIN }}
          SUDO_PASS: ${{ secrets.VPS_PASSWORD }}

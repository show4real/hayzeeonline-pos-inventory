# The stack sits behind Apache on the VPS, which terminates TLS, so this
# server speaks plain HTTP and takes the client's real address and scheme from
# the headers that proxy sets.

# Trust the proxy for X-Forwarded-For. Docker bridge networks are RFC1918 and
# the port is bound to localhost, so nothing else can reach this.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# NOTE: deliberately not an `upstream` block. nginx resolves the names in one
# of those exactly once, at startup, and caches the address for ever — so the
# first deploy that replaces the app container leaves nginx talking to an IP
# that no longer exists, and every request 502s until nginx restarts too.
#
# Resolving through Docker's embedded DNS at request time instead means a
# replaced app container is picked up within `valid`.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;

    # Product images are posted as base64 inside a JSON body, so the request
    # body is larger than the file. nginx's 1MB default answers 413.
    client_max_body_size 64M;

    # Container-level check, answered by nginx alone. Laravel's own /up still
    # exercises the PHP path, and that is what deploy.sh polls.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploads: served straight off the volume, never through PHP.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php is ever executed. Anything else ending in .php is a
    # probe, not a route.
    location ~ ^/index\.php(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Laravel reads this to rebuild the original URL behind the proxy.
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve the things that must not be reachable even if they end up
    # under the web root. public/error_log is a real committed file in this
    # repository — PHP stack traces with absolute server paths — and it has no
    # extension, so the extension rule below would not catch it.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|sql|sqlite|log|ini|sh|bak|lock|json|ya?ml)$ { deny all; }
    location ~* ^/(error_log|web\.config|composer\.(json|lock))$ { deny all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript application/xml
               text/css text/plain text/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

; Production PHP settings, mounted at /usr/local/etc/php/conf.d/99-app.ini

memory_limit = 512M
max_execution_time = 120

; Product images arrive base64-encoded inside a JSON body, so the request is
; about a third larger than the file itself.
upload_max_filesize = 64M
post_max_size = 64M

; Never render a stack trace to the client; Laravel handles reporting and the
; logs are the place for detail. This is the backstop for an .env that is
; wrong about APP_DEBUG.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

; UTC here, deliberately: the application sets Africa/Lagos from
; config/app.php, and this only affects PHP code that runs outside the
; framework.
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a running container — a new release is a new
; image — so opcache never needs to stat files for changes. The dev image sets
; the opposite, because there the code is bind-mounted.
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
